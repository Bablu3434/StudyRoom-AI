<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Verify OTP | StudyRoom AI
    </title>

    <link
        rel="stylesheet"
        href="css/verify-login-otp.css"
    >

</head>

<body>

    <main class="otp-card">

        <h1>
            Verify Login
        </h1>

        <p class="subtitle">
            We sent a 6-digit OTP to your registered email.
        </p>


        <form id="otpForm">

            <label for="otpInput">
                Enter OTP
            </label>

            <input
                type="text"
                id="otpInput"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                required
            >


            <button
                type="submit"
                id="verifyOtpBtn"
            >
                Verify OTP
            </button>

        </form>


        <div id="otpMessage"></div>


        <p class="back-text">

            <a href="login.html">
                Back to Login
            </a>

        </p>

    </main>


    <script src="js/verify-login-otp.js"></script>

</body>

</html>

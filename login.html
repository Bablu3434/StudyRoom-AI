<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudyRoom AI</title>

    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-left">

        <a href="index.html" class="logo">
            <span>AI</span>
            StudyRoom
        </a>

        <div class="left-content">
            <h1>Welcome Back!</h1>

            <p>
                Continue your learning journey and stay focused
                on your study goals.
            </p>

            <div class="feature">
                ✓ Smart Study Planner
            </div>

            <div class="feature">
                ✓ Progress Tracking
            </div>

            <div class="feature">
                ✓ AI Study Suggestions
            </div>
        </div>

    </div>


    <div class="auth-right">

        <div class="form-box">

            <div class="form-header">
                <h2>Login</h2>

                <p>
                    Enter your account details
                </p>
            </div>


            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="input-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleLoginPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Login
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <button class="google-btn">

                <span>G</span>

                Continue with Google

            </button>


            <p class="switch-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</div>


<script src="js/auth.js"></script>

</body>
</html>

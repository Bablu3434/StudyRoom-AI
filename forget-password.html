<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | StudyRoom AI
    </title>

    <link rel="stylesheet" href="css/forget-password.css">

</head>

<body>

    <main>

        <h1>
            Forgot Password
        </h1>

        <p>
            Enter your registered email.
        </p>


        <form id="forgotPasswordForm">

            <label for="forgotEmail">
                Email
            </label>

            <input
                type="email"
                id="forgotEmail"
                required
            >


            <button type="submit">
                Create Reset Link
            </button>

        </form>


        <div id="forgotMessage"></div>


        <div
            id="resetLinkBox"
            style="display: none;"
        >

            <p>
                Development Reset Link:
            </p>

            <a
                id="resetLink"
                href="#"
            >
                Reset Password
            </a>

        </div>


        <p>
            <a href="login.html">
                Back to Login
            </a>
        </p>

    </main>


    <script src="js/forgot-password.js"></script>

</body>

</html>

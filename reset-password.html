<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | StudyRoom AI
    </title>

    <link rel ="stylesheet" href="css/reset-password.css" >

</head>

<body>

    <main>

        <h1>
            Reset Password
        </h1>


        <form id="resetPasswordForm">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                minlength="6"
                required
            >


            <label for="confirmNewPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmNewPassword"
                minlength="6"
                required
            >


            <button type="submit">
                Reset Password
            </button>

        </form>


        <div id="resetMessage"></div>


        <p>
            <a href="login.html">
                Back to Login
            </a>
        </p>

    </main>


    <script src="js/reset-password.js"></script>

</body>

</html>

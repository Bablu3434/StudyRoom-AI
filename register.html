<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | StudyRoom AI</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-left">

        <a href="index.html" class="logo">

            <span>AI</span>

            StudyRoom

        </a>


        <div class="left-content">

            <h1>
                Start Studying Smarter.
            </h1>

            <p>
                Create your StudyRoom AI account and build
                better study habits.
            </p>


            <div class="feature">
                ✓ Personalized Study Plans
            </div>

            <div class="feature">
                ✓ Focus Timer
            </div>

            <div class="feature">
                ✓ Weak Topic Analysis
            </div>

        </div>

    </div>


    <div class="auth-right">

        <div class="form-box">

            <div class="form-header">

                <h2>Create Account</h2>

                <p>
                    Start your smart learning journey
                </p>

            </div>


            <form id="registerForm">


                <div class="input-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleRegisterPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="input-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        required
                    >

                    I agree to the Terms & Conditions

                </label>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="switch-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>


<script src="js/auth.js"></script>

</body>
</html>
